# Netlify configuration for the vlipa static site.
# Publishing the repository root: there is no build step.

[build]
  publish = "."
  # There is no site build. The install step exists so the functions can be
  # bundled with their dependencies; without it the function build fails and
  # the whole deploy fails with it.
  command = "npm ci --no-audit --no-fund"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# API
[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/api/auth/*"
  to = "/.netlify/functions/auth/:splat"
  status = 200

# Clean URLs
[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/signup"
  to = "/signup.html"
  status = 200

[[redirects]]
  from = "/account"
  to = "/account.html"
  status = 200

[[redirects]]
  from = "/hizmetler"
  to = "/hizmetler.html"
  status = 200

[[redirects]]
  from = "/hakkimizda"
  to = "/hakkimizda.html"
  status = 200

[[redirects]]
  from = "/iletisim"
  to = "/iletisim.html"
  status = 200

[[redirects]]
  from = "/tesekkurler"
  to = "/tesekkurler.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
