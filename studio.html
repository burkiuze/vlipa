<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>vlipa studio</title>
<meta name="description" content="Şirketini vlipa studio üzerinden yönet: görevler, tablolar, toplantılar, ekip ve Vlipa." />
<meta name="theme-color" content="#ffffff" />
<meta name="robots" content="noindex" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="assets/img/favicon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="assets/css/studio.css" />
</head>
<body>

<div class="app">

  <aside class="side" id="side">
    <div class="side__head">
      <a class="brand" href="/"><img src="assets/img/vlipa-ai-96.png" alt="" width="22" height="22" /> vlipa</a>
      <div class="copicker" id="coPicker"></div>
    </div>

    <nav class="nav" id="nav" aria-label="Bölümler"></nav>

    <div class="side__foot">
      <div class="spread">
        <button class="ghostlink" id="newCo" type="button">+ Şirket</button>
        <button class="ghostlink" id="joinCo" type="button">Davet kodu</button>
      </div>
      <div class="me">
        <span id="who"></span>
        <button class="ghostlink" id="signOut" type="button">Çıkış</button>
      </div>
    </div>
  </aside>

  <div class="scrim" id="scrim" hidden></div>

  <main class="main">
    <header class="mainbar">
      <button class="burger" id="burger" type="button" aria-label="Menüyü aç">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
      </button>
      <h1 id="pageTitle">Panel</h1>
      <span class="mainbar__co" id="coName2"></span>
    </header>

    <div class="view" id="view"></div>
  </main>
</div>

<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" role="status"></div>

<script type="module" src="assets/js/studio/app.js"></script>
</body>
</html>
