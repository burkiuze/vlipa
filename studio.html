<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>vlipa studio</title>
<meta name="description" content="Run your company from vlipa studio: tasks, tables, meetings, your team and Vlipa." />
<meta name="theme-color" content="#ffffff" />
<meta name="robots" content="noindex" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/assets/img/favicon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="assets/css/studio.css" />
</head>
<body>

<div class="app">

  <aside class="side" id="side">
    <div class="side__head">
      <a class="brand" href="/"><img src="assets/img/vlipa-ai-96.png" alt="" width="22" height="22" /> <span>vlipa</span></a>
      <button class="sidefold" id="sideFold" type="button" aria-label="Narrow the menu" title="Narrow the menu">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 5v14M9 8l-4 4 4 4M12 12h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="copicker" id="coPicker"></div>
    </div>

    <nav class="nav" id="nav" aria-label="Sections"></nav>

    <div class="side__foot">
      <div class="spread">
        <button class="ghostlink" id="newCo" type="button">+ Company</button>
        <button class="ghostlink" id="joinCo" type="button">Invite code</button>
      </div>
      <div class="me">
        <span id="who"></span>
        <button class="ghostlink" id="signOut" type="button">Sign out</button>
      </div>
    </div>
  </aside>

  <div class="scrim" id="scrim" hidden></div>

  <main class="main">
    <header class="mainbar">
      <button class="burger" id="burger" type="button" aria-label="Open the menu">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
      </button>
      <h1 id="pageTitle">Panel</h1>
      <span class="mainbar__co" id="coName2"></span>
    </header>

    <div class="view" id="view">
      <div class="empty empty--big" id="bootnote">
        <h3>Loading…</h3>
        <p>The studio is opening.</p>
      </div>
      <noscript>
        <div class="empty empty--big">
          <h3>JavaScript is off</h3>
          <p>vlipa studio runs on JavaScript. Switch it on in your browser and reload.</p>
        </div>
      </noscript>
    </div>
  </main>
</div>

<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" role="status"></div>

<!-- The watchdog: if the studio has not taken over the page in ten seconds,
     whatever went wrong is written here instead of leaving a blank screen. -->
<script>
(function () {
  var trouble = '';
  var note = function (text) { trouble = trouble || String(text || ''); };

  window.addEventListener('error', function (event) {
    note(event.message + (event.filename ? ' — ' + event.filename.split('/').pop() : ''));
  });

  window.addEventListener('unhandledrejection', function (event) {
    note(event.reason && event.reason.message ? event.reason.message : event.reason);
  });

  setTimeout(function () {
    if (document.documentElement.dataset.booted === '1') return;

    var view = document.getElementById('view');
    if (!view) return;

    view.innerHTML =
      '<div class="empty empty--big">' +
        '<h3>The studio did not open</h3>' +
        '<p>' + (trouble ? trouble.replace(/</g, '&lt;') : 'No answer came from the server.') + '</p>' +
        '<div class="spread">' +
          '<button class="btn" type="button" onclick="location.reload()">Try again</button>' +
          '<a class="btn btn--ghost" href="/login">Sign-in page</a>' +
          '<a class="ghostlink" href="/setup" target="_blank" rel="noopener">Setup check</a>' +
        '</div>' +
      '</div>';
  }, 10000);
})();
</script>
<script type="module" src="assets/js/studio/app.js"></script>
</body>
</html>
