<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Vlipa — vlipa studio</title>
<meta name="description" content="Vlipa ile sohbet et. Hızlı mod anında cevaplar, düşün modu önce düşünür." />
<meta name="theme-color" content="#ffffff" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="assets/img/favicon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="assets/css/studio.css" />
</head>
<body>

<div class="app">

  <aside class="side" id="side">
    <div class="side__head">
      <a class="brand" href="/"><img src="assets/img/vlipa-ai-96.png" alt="" width="22" height="22" /> vlipa</a>
      <button class="newchat" id="newChat" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Yeni sohbet
      </button>
    </div>

    <p class="side__label">Sohbetler</p>
    <nav class="side__list" id="chatList" aria-label="Geçmiş sohbetler"></nav>

    <div class="side__foot">
      <a class="linkish" href="/">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Siteye dön
      </a>
    </div>
  </aside>

  <div class="scrim" id="scrim" hidden></div>

  <main class="main">
    <div class="mainbar">
      <button class="burger" id="burger" type="button" aria-label="Sohbetleri aç">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
      </button>
      <a class="brand" href="/"><img src="assets/img/vlipa-ai-96.png" alt="" width="22" height="22" /> Vlipa</a>
    </div>

    <div class="thread" id="thread">
      <div class="thread__inner" id="log">
        <div class="welcome" id="welcome">
          <img class="welcome__photo" src="assets/img/vlipa-ai-256.png" alt="Vlipa" width="88" height="88" />
          <h1>Ben Vlipa</h1>
          <p>Bir şey sor. İstersen önce düşünmemi, istersen hemen cevap vermemi seç.</p>
          <div class="starters">
            <button type="button">Sen kimsin?</button>
            <button type="button">vlipa neler yapıyor?</button>
            <button type="button">Küçük bir işletmeye otomasyon fikri ver</button>
          </div>
        </div>
      </div>
    </div>

    <div class="composer">
      <div class="composer__inner">
        <div class="composer__box">
          <textarea id="input" rows="1" placeholder="Bir şey yaz…" autocomplete="off"></textarea>

          <div class="composer__row">
            <div class="modes" role="group" aria-label="Yanıt modu">
              <button type="button" data-mode="fast" aria-pressed="true" title="Hemen cevap verir">Hızlı</button>
              <button type="button" data-mode="thinking" aria-pressed="false" title="Önce düşünür, sonra cevaplar">Düşün</button>
            </div>

            <button class="chip" id="clear" type="button" hidden>Temizle</button>

            <span class="grow"></span>

            <button class="round round--send" id="send" type="button" title="Gönder">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h13M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>

        <p class="hint" id="hint">Enter gönderir, Shift + Enter alt satıra geçer.</p>
      </div>
    </div>
  </main>
</div>

<script type="module" src="assets/js/studio.js"></script>
</body>
</html>
