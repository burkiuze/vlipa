<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84.9 36.0" width="84.9" height="36.0" role="img" aria-label="tavily">
  <!-- The wordmark, drawn as outlines so it needs no font: an <img> loads
     its SVG in a document of its own, with no access to the page's
     webfont, and text set as <text> there comes out in whatever the
     machine happens to have.

     This is a stand-in, not the official mark. To use the real one,
     drop the brand SVG over this file and leave everything else alone:
     the strip fixes the height and greys whatever it is handed, so a
     logo in full colour arrives in the same key. -->
