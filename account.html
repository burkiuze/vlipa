<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Müşteri paneli · vlipa</title>
  <meta name="description" content="vlipa müşteri paneli." />
  <meta name="theme-color" content="#3532f6" />
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/img/vlipa-tile-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/auth.css" />
</head>
<body>
  <header class="authbar">
    <a class="brand" href="index.html" aria-label="vlipa ana sayfa">
      <img class="brand__mark" src="assets/img/vlipa-mark.png" alt="" width="30" height="30" />
      <span class="brand__name">vlipa</span>
    </a>
    <a class="authbar__back" href="index.html">Ana sayfaya dön</a>
  </header>

  <main class="shell">
    <p class="status" id="accountLoading">Oturumunuz kontrol ediliyor…</p>

    <section class="card" id="accountCard" aria-labelledby="accountGreeting" hidden>
      <div class="card__head">
        <span class="avatar" id="accountInitial" aria-hidden="true"></span>
        <h1 id="accountGreeting">Tekrar hoş geldiniz.</h1>
        <p class="sub" id="accountEmail"></p>
        <p class="sub" id="accountSince"></p>
      </div>

      <div class="account__actions">
        <a class="btn btn--primary" href="iletisim.html">Yeni talep oluştur</a>
        <a class="btn btn--ghost" href="hizmetler.html">Hizmetleri incele</a>
        <button class="btn btn--ghost" type="button" id="signOut">Çıkış yap</button>
      </div>
    </section>
  </main>

<script src="assets/js/auth-api.js"></script>
<script src="assets/js/account.js"></script>
</body>
</html>
