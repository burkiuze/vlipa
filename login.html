<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in — vlipa studio</title>
<meta name="description" content="Sign in to the free vlipa studio." />
<meta name="theme-color" content="#3532f6" />
<meta name="robots" content="noindex" />
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="assets/css/app.css" />
</head>
<body>

<header class="authbar">
  <a class="mark" href="/"><img src="assets/img/vlipa-mark.png" alt="" width="24" height="24" /> vlipa</a>
  <a href="/">Back to the site</a>
</header>

<main class="shell">
  <section class="card">
    <h1>Sign in</h1>
    <p class="note">The studio is free. Sign in to keep your sites and teams.</p>

    <form id="form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required
               placeholder="you@company.com" spellcheck="false" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password"
               required minlength="8" placeholder="••••••••" />
      </div>

      <div class="field">
        <label for="captcha">Security code <span class="hint">type what you see</span></label>
        <div class="captcha">
          <span class="captcha__img" id="captchaImg"></span>
          <button class="captcha__new" id="captchaNew" type="button" aria-label="New code" title="New code">
            <svg viewBox="0 0 24 24" fill="none"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v4.2h-4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <input id="captcha" name="captcha" type="text" maxlength="5" required
                 autocomplete="off" spellcheck="false" placeholder="Code" />
        </div>
      </div>

      <button class="btn btn--block" id="submit" type="submit">Sign in</button>
      <p class="error" id="message" role="alert" style="margin-top:14px"></p>
    </form>

    <p class="switch">No account yet? <a href="/signup">Create one</a></p>
  </section>
</main>

<script type="module" src="assets/js/auth.js"></script>
</body>
</html>
