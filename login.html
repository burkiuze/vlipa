<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Giriş — vlipa studio</title>
<meta name="description" content="vlipa studio hesabına giriş yap." />
<meta name="theme-color" content="#3532f6" />
<meta name="robots" content="noindex" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/assets/img/favicon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="assets/css/auth.css" />
</head>
<body>

<header class="authbar">
  <a class="mark" href="/"><img src="assets/img/vlipa-mark.png" alt="" width="24" height="24" /> vlipa</a>
  <a href="/">Siteye dön</a>
</header>

<main class="shell">
  <section class="card">
    <h1>Giriş yap</h1>
    <p class="note">Şirketini, görevlerini ve ekibini yönetmek için giriş yap.</p>


    <div class="alt" id="googleWrap" hidden>
      <a class="btn btn--ghost btn--block gbtn" id="google" href="/api/auth/google">
        <svg viewBox="0 0 18 18" aria-hidden="true" width="18" height="18">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.97 10.72a5.41 5.41 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
        </svg>
        Google ile devam et
      </a>
      <span class="alt__or">ya da e-posta ile</span>
    </div>

    <form id="form" novalidate>
      <div class="field">
        <label for="email">E-posta</label>
        <input id="email" name="email" type="email" autocomplete="email" required
               placeholder="ad@sirket.com" spellcheck="false" />
      </div>

      <div class="field">
        <label for="password">Şifre</label>
        <input id="password" name="password" type="password" autocomplete="current-password"
               required minlength="8" placeholder="••••••••" />
      </div>

      <div class="field">
        <label for="captcha">Güvenlik kodu <span class="hint">gördüğünü yaz</span></label>
        <div class="captcha">
          <span class="captcha__img" id="captchaImg"></span>
          <button class="captcha__new" id="captchaNew" type="button" aria-label="Yeni kod" title="Yeni kod">
            <svg viewBox="0 0 24 24" fill="none"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v4.2h-4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <input id="captcha" name="captcha" type="text" maxlength="5" required
                 autocomplete="off" spellcheck="false" placeholder="Kod" />
        </div>
      </div>

      <button class="btn btn--block" id="submit" type="submit">Giriş yap</button>
      <p class="error" id="message" role="alert" style="margin-top:14px"></p>
    </form>

    <p class="switch">Hesabın yok mu? <a href="/signup">Hesap aç</a></p>
  </section>
</main>

<script type="module" src="assets/js/auth.js"></script>
</body>
</html>
