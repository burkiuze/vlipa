<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hesap aç — vlipa studio</title>
<meta name="description" content="Ücretsiz vlipa studio hesabı aç." />
<meta name="theme-color" content="#3532f6" />
<meta name="robots" content="noindex" />
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="assets/css/auth.css" />
</head>
<body>

<header class="authbar">
  <a class="mark" href="/"><img src="assets/img/vlipa-mark.png" alt="" width="24" height="24" /> vlipa</a>
  <a href="/">Siteye dön</a>
</header>

<main class="shell">
  <section class="card">
    <h1>Hesap aç</h1>
    <p class="note">Ücretsiz. Hesabını açtıktan sonra şirket kurabilir ya da davet koduyla bir şirkete katılabilirsin.</p>

    <form id="form" novalidate>
      <div class="field">
        <label for="name">Ad soyad <span class="hint">isteğe bağlı</span></label>
        <input id="name" name="name" type="text" autocomplete="name" maxlength="60" placeholder="Ad Soyad" />
      </div>

      <div class="field">
        <label for="email">E-posta</label>
        <input id="email" name="email" type="email" autocomplete="email" required
               placeholder="ad@sirket.com" spellcheck="false" />
      </div>

      <div class="field">
        <label for="password">Şifre</label>
        <input id="password" name="password" type="password" autocomplete="new-password"
               required minlength="8" placeholder="En az 8 karakter" />
        <p class="strength" id="strength" data-score="0"><i></i><span></span></p>
      </div>

      <div class="field">
        <label for="captcha">Güvenlik kodu <span class="hint">gördüğünü yaz</span></label>
        <div class="captcha">
          <span class="captcha__img" id="captchaImg"></span>
          <button class="captcha__new" id="captchaNew" type="button" aria-label="Yeni kod" title="Yeni kod">
            <svg viewBox="0 0 24 24" fill="none"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v4.2h-4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <input id="captcha" name="captcha" type="text" maxlength="5" required
                 autocomplete="off" spellcheck="false" placeholder="Kod" />
        </div>
      </div>

      <button class="btn btn--block" id="submit" type="submit">Hesap aç</button>
      <p class="error" id="message" role="alert" style="margin-top:14px"></p>
    </form>

    <p class="switch">Zaten hesabın var mı? <a href="/login">Giriş yap</a></p>
  </section>
</main>

<script type="module" src="assets/js/auth.js"></script>
</body>
</html>
