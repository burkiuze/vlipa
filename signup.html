<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Create an account · vlipa</title>
  <meta name="description" content="Create a vlipa account." />
  <meta name="theme-color" content="#3532f6" />
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/img/vlipa-tile-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/auth.css" />
</head>
<body>
  <header class="authbar">
    <a class="brand" href="index.html" aria-label="vlipa ana sayfa">
      <img class="brand__mark" src="assets/img/vlipa-mark.png" alt="" width="30" height="30" />
      <span class="brand__name">vlipa</span>
    </a>
    <a class="authbar__back" href="index.html">Ana sayfaya dön</a>
  </header>

  <main class="shell">
    <section class="card" aria-labelledby="title">
      <div class="card__head">
        <img class="card__mark" src="assets/img/vlipa-mark.png" alt="" width="42" height="42" />
        <h1 id="title">Hesap oluşturun</h1>
        <p class="sub">Proje takibi ve dosyalarınız için müşteri paneli hesabı.</p>
      </div>

      <form class="form" id="signupForm" novalidate>
        <div class="field">
          <label for="name">Ad soyad <span class="optional">isteğe bağlı</span></label>
          <input id="name" name="name" type="text" autocomplete="name"
                 placeholder="Ad Soyad" maxlength="60" spellcheck="false" />
        </div>

        <div class="field">
          <label for="email">E-posta</label>
          <input id="email" name="email" type="email" inputmode="email" autocomplete="email"
                 placeholder="ad@sirket.com" spellcheck="false" required
                 aria-describedby="emailError" />
          <p class="error" id="emailError" role="alert" hidden></p>
        </div>

        <div class="field">
          <label for="password">Şifre</label>
          <div class="input-wrap">
            <input id="password" name="password" type="password" 
                   placeholder="En az 8 karakter" required minlength="8"
                   autocomplete="new-password" aria-describedby="passwordError" />
            <button class="reveal" type="button" id="reveal"
                    aria-label="Şifreyi göster" aria-pressed="false">
              <svg class="icon icon--eye" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M2.5 12S6 5.8 12 5.8 21.5 12 21.5 12 18 18.2 12 18.2 2.5 12 2.5 12Z"
                      stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="2.9" stroke="currentColor" stroke-width="1.6"/>
              </svg>
              <svg class="icon icon--eye-off" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 4.5 20 19.5M9.9 6.2A9.6 9.6 0 0 1 12 5.8c6 0 9.5 6.2 9.5 6.2a17 17 0 0 1-3.2 3.9M6.6 8.2A17 17 0 0 0 2.5 12S6 18.2 12 18.2c1 0 1.9-.17 2.7-.45"
                      stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
          <p class="strength" id="strength" data-score="0" hidden>
            <i aria-hidden="true"></i><span></span>
          </p>
          <p class="error" id="passwordError" role="alert" hidden></p>
        </div>

        <div class="field">
          <label for="captcha">Güvenlik kontrolü</label>
          <div class="captcha">
            <canvas class="captcha__canvas" id="captchaCanvas" width="132" height="46"
                    role="img" aria-label="Güvenlik kodu görseli"></canvas>
            <button class="captcha__reload" type="button" id="captchaReload"
                    aria-label="Yeni kod" title="Yeni kod">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v4.2h-4.2" stroke="currentColor"
                      stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <input id="captcha" name="captcha" type="text" inputmode="latin" autocomplete="off"
                   placeholder="Kod" spellcheck="false" maxlength="5" required
                   aria-describedby="captchaError" />
          </div>
          <p class="error" id="captchaError" role="alert" hidden></p>
        </div>

        <button class="btn btn--primary" type="submit" id="submitBtn">
          <span class="btn__label">Hesap oluştur</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>

        <p class="status" id="formStatus" role="status" aria-live="polite"></p>
      </form>

      <p class="switch">Zaten hesabınız var mı? <a class="link" href="/login">Giriş yapın</a></p>
    </section>

    <p class="legal">
      Devam ederek <a href="#">Kullanım Koşulları</a> ve <a href="#">Gizlilik Politikası</a>’nı kabul etmiş olursunuz.
    </p>
  </main>


<script src="assets/js/captcha.js"></script>
<script src="assets/js/auth-api.js"></script>
<script src="assets/js/signup.js"></script>
</body>
</html>
